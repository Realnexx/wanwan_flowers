name: Deploy MULTI-POS to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Explain FTP deployment status
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED || 'true' }}
        run: |
          if [ "$DEPLOY_ENABLED" = "true" ]; then
            echo "### FTP deployment enabled" >> "$GITHUB_STEP_SUMMARY"
            echo "Validation must pass before the deploy job uploads files. Check that job's upload log to confirm delivery." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::FTP upload is disabled. This run validates and packages files only; no files will be sent to InfinityFree. Set DEPLOY_ENABLED=true after confirming hosting configuration."
            echo "### No files uploaded: FTP deployment disabled" >> "$GITHUB_STEP_SUMMARY"
            echo 'This run validates and packages files only. The deploy job is skipped unless the repository variable DEPLOY_ENABLED is exactly true. Confirm FTP settings and private production configuration before enabling it.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, fileinfo
          coverage: none
      - name: Validate deployment boundaries
        run: python3 -m unittest discover -s tools/tests -v
      - name: Validate PHP and assemble runtime files
        run: python3 tools/prepare-deploy.py
      - name: Save reviewed runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime
          path: .deploy/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: validate
    # Enabled by default unless DEPLOY_ENABLED is explicitly set to 'false'.
    if: vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-runtime
          path: .deploy/
      - name: Check confirmed hosting settings
        env:
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || '/htdocs/' }}
          PROTOCOL: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
          PORT: ${{ vars.FTP_PORT || secrets.FTP_PORT || '21' }}
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import os
          for key in ('SERVER_DIR', 'PROTOCOL', 'PORT', 'FTP_SERVER', 'FTP_USERNAME', 'FTP_PASSWORD'):
              if not os.environ.get(key):
                  raise SystemExit('Missing required hosting setting: ' + key)
          path = os.environ['SERVER_DIR']
          if not path.endswith('/') or path in ('/', './') or '..' in path.split('/'):
              raise SystemExit('Set a confirmed document root with a trailing slash, e.g. /htdocs/.')
          if os.environ['PROTOCOL'] not in ('ftp', 'ftps', 'ftps-legacy'):
              raise SystemExit('Unsupported FTP protocol.')
          if not os.environ['PORT'].isdigit() or not 1 <= int(os.environ['PORT']) <= 65535:
              raise SystemExit('Invalid FTP port.')
      - name: Incremental production deployment
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || secrets.FTP_PORT || '21' }}
          server-dir: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || '/htdocs/' }}
          local-dir: ./.deploy/
          dangerous-clean-slate: false
          security: strict
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            config/config.local.php
            config/config.production.php
            config/init_db.php
            assets/uploads/**
            assets/img/products/**
            assets/img/users/**
            assets/img/branches/**
            assets/img/logo_*
            **/*.log
            **/*.bak
            **/*.sql
